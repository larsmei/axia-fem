name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach artifacts to (e.g. v1.11.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.alias }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: axia
            archive: tar.gz
            alias: linux-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: axia
            archive: tar.gz
            alias: linux-x64-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin: axia
            archive: tar.gz
            alias: linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: axia.exe
            archive: zip
            alias: windows-x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            bin: axia.exe
            archive: zip
            alias: windows-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: axia
            archive: tar.gz
            alias: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: axia
            archive: tar.gz
            alias: macos-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        working-directory: solver
        run: cargo build --release --bin axia --target ${{ matrix.target }} --features cli

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${VER#v}"
          EXT="${{ matrix.archive }}"
          STAGE="axia-${VER}-${{ matrix.target }}"
          ALIAS="axia-${VER}-${{ matrix.alias }}"
          mkdir -p "dist/${STAGE}"
          cp "solver/target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${STAGE}/"
          cp README.md LICENSE "dist/${STAGE}/"
          mkdir -p "dist/${STAGE}/examples"
          cp examples/*.inp "dist/${STAGE}/examples/"
          cd dist
          if [ "$EXT" = "zip" ]; then
            7z a -tzip "${STAGE}.zip" "${STAGE}" >/dev/null
          else
            tar -czf "${STAGE}.tar.gz" "${STAGE}"
          fi
          cp "${STAGE}.${EXT}" "${ALIAS}.${EXT}"
          echo "ASSET=${STAGE}.${EXT}" >> "$GITHUB_ENV"
          echo "ASSET_ALIAS=${ALIAS}.${EXT}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: axia-${{ matrix.alias }}
          path: |
            dist/${{ env.ASSET }}
            dist/${{ env.ASSET_ALIAS }}

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/${{ env.ASSET }}
            dist/${{ env.ASSET_ALIAS }}
          generate_release_notes: false
          draft: false

  checksums:
    name: SHA256SUMS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          ls -1
          sha256sum axia-* | tee SHA256SUMS

      - name: Attach SHA256SUMS
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/SHA256SUMS
          generate_release_notes: false
          draft: false
