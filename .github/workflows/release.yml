      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${VER#v}"
          EXT="${{ matrix.archive }}"
          STAGE="axia-${VER}-${{ matrix.target }}"
          ALIAS="axia-${VER}-${{ matrix.alias }}"
          BIN="solver/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          for d in "${STAGE}" "${ALIAS}"; do
            mkdir -p "dist/${d}/examples"
            cp "$BIN" "dist/${d}/"
            cp README.md LICENSE "dist/${d}/"
            cp examples/*.inp "dist/${d}/examples/"
          done
          cd dist
          if [ "$EXT" = "zip" ]; then
            7z a -tzip "${STAGE}.zip" "${STAGE}" >/dev/null
            7z a -tzip "${ALIAS}.zip" "${ALIAS}" >/dev/null
          else
            tar -czf "${STAGE}.tar.gz" "${STAGE}"
            tar -czf "${ALIAS}.tar.gz" "${ALIAS}"
          fi
          echo "ASSET=${STAGE}.${EXT}" >> "$GITHUB_ENV"
          echo "ASSET_ALIAS=${ALIAS}.${EXT}" >> "$GITHUB_ENV"