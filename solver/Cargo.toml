[package]
name = "axia-fem"
version = "1.23.0"
edition = "2021"
description = "FEM solver with CalculiX INP/FRD compatibility; PARDISO/faer/rivrs selectable sparse backends"
license = "MIT"
authors = ["Lars Meindl"]
repository = "https://github.com/larsmei/axia-fem"
readme = "../README.md"
default-run = "axia"
include = ["src/**/*", "Cargo.toml", "../LICENSE", "../README.md"]

[lib]
name = "axia_fem"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "axia"
path = "src/bin/axia.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = []

[dependencies]
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"

# Native sparse backends. PARDISO is loaded at runtime (MKL / Panua).
# faer (already here) is the pure-Rust supernodal fallback; rivrs-sparse is LDLT.
[target.'cfg(all(not(target_arch = "wasm32"), target_arch = "x86_64"))'.dependencies]
pardiso-wrapper = { version = "0.1.2", features = ["mkl", "panua"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_arch = "x86_64")))'.dependencies]
pardiso-wrapper = { version = "0.1.2", features = ["panua"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rivrs-sparse = "0.1.1"
faer = "0.24"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
