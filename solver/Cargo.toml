[package]
name = "axia-fem"
version = "0.3.0"
edition = "2021"
description = "Linear static FEM solver with CalculiX INP/FRD compatibility"
license = "MIT"
authors = ["Lars Meindl"]
repository = "https://github.com/larsmei/axia-fem"
readme = "../README.md"
default-run = "axia"
include = ["src/**/*", "Cargo.toml", "../LICENSE", "../README.md"]

[lib]
name = "axia_fem"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "axia"
path = "src/bin/axia.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = []

[dependencies]
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
